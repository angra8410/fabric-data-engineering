name: Daily Colombia President News

on:
  schedule:
    - cron: "0 12 * * *"  # daily at 12:00 UTC (7am Colombia)
    - cron: "0 13 1 * *"  # monthly report: 1st of month at 13:00 UTC
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: news-pipeline
        run: pip install -r requirements.txt

      - name: Run pipeline (Gemini)
        working-directory: news-pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python run_pipeline.py gemini

      - name: Generate monthly report (1st of month)
        working-directory: news-pipeline
        if: github.event.schedule == '0 12 1 * *'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python monthly_report.py gemini

      - name: Commit data
        working-directory: news-pipeline
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/ reports/
          git diff --cached --quiet || git commit -m "news: daily update $(date -u +%F)"
          git push

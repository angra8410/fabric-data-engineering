name: job-boards-daily

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit seen.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Job-Alerts/requirements.txt

      - name: Install dependencies
        run: pip install -r Job-Alerts/requirements.txt

      - name: Run job boards agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # langchain-google-genai reads GOOGLE_API_KEY; stored as JOB_ALERTS_GEMINI
          GOOGLE_API_KEY: ${{ secrets.JOB_ALERTS_GEMINI }}
          LLM_PROVIDER: gemini # no Ollama on GitHub runners
        run: python Job-Alerts/run.py

      - name: Commit updated seen.json (dedupe state)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Job-Alerts/data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen jobs [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
